# Lychee link checker configuration
# https://lychee.cli.rs/

# URLs that block automated requests or require authentication
exclude = [
    # DOI resolvers return 403 for bots but work for browsers
    "^https://doi\\.org/",
    # Sites requiring authentication
    "^https://claude\\.ai/",
    # GitHub issue creation requires login
    "^https://github\\.com/.*/issues/new",
    # DICOM NEMA server
    "^https://dicom\\.nema\\.org",
    # IDC MCP endpoint: an MCP transport, not a page (405 to HEAD, 406 to GET)
    "^https://api\\.imaging\\.datacommons\\.cancer\\.gov/mcp"
]
